# Cloud Build configuration for Backend only
# Build with: gcloud builds submit --project=mlpoker --config=cloudbuild-backend.yaml .

substitutions:
  _REGION: us-central1
  _BACKEND_SERVICE: pokerml-backend
  _TAG: latest

steps:
  # Build backend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/${_BACKEND_SERVICE}:${_TAG}'
      - '-f'
      - 'backend/Dockerfile'
      - '.'
    id: 'build-backend'

  # Push backend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/${PROJECT_ID}/${_BACKEND_SERVICE}:${_TAG}'
    id: 'push-backend'
    waitFor: ['build-backend']

  # Deploy backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_BACKEND_SERVICE}'
      - '--image=gcr.io/${PROJECT_ID}/${_BACKEND_SERVICE}:${_TAG}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--set-secrets=DATABRICKS_WORKSPACE_URL=databricks_workspace_url:latest,DATABRICKS_TOKEN=databricks_token:latest,OPENAI_API_KEY=ANTHROPIC_API_KEY:latest'
    id: 'deploy-backend'
    waitFor: ['push-backend']

images:
  - 'gcr.io/${PROJECT_ID}/${_BACKEND_SERVICE}:${_TAG}'

options:
  logging: CLOUD_LOGGING_ONLY
timeout: 900s
