# Cloud Build configuration for Aurora Poker App
# This builds and deploys both backend and frontend to GCP

substitutions:
  _REGION: us-central1
  _BACKEND_SERVICE: aurora-poker-backend
  _FRONTEND_SERVICE: aurora-poker-frontend
  _TAG: v1

steps:
  # ============ BACKEND ============

  # Build backend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/${_BACKEND_SERVICE}:${_TAG}'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/${_BACKEND_SERVICE}:latest'
      - '-f'
      - 'backend/Dockerfile'
      - '.'
    id: 'build-backend'

  # Push backend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/${PROJECT_ID}/${_BACKEND_SERVICE}:${_TAG}'
    id: 'push-backend'
    waitFor: ['build-backend']

  # Deploy backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_BACKEND_SERVICE}'
      - '--image=gcr.io/${PROJECT_ID}/${_BACKEND_SERVICE}:${_TAG}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--set-secrets=DATABRICKS_WORKSPACE_URL=databricks_workspace_url:latest,DATABRICKS_TOKEN=databricks_token:latest,OPENAI_API_KEY=ANTHROPIC_API_KEY:latest'
    id: 'deploy-backend'
    waitFor: ['push-backend']

  # ============ FRONTEND ============

  # Build frontend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/${_FRONTEND_SERVICE}:${_TAG}'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/${_FRONTEND_SERVICE}:latest'
      - '--build-arg'
      - 'VITE_API_BASE=https://aurora-poker-backend-745748443990.us-central1.run.app'
      - '-f'
      - 'frontend/poker-client/Dockerfile'
      - '.'
    id: 'build-frontend'
    waitFor: ['deploy-backend']

  # Push frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/${PROJECT_ID}/${_FRONTEND_SERVICE}:${_TAG}'
    id: 'push-frontend'
    waitFor: ['build-frontend']

  # Deploy frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_FRONTEND_SERVICE}'
      - '--image=gcr.io/${PROJECT_ID}/${_FRONTEND_SERVICE}:${_TAG}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=5'
    id: 'deploy-frontend'
    waitFor: ['push-frontend']

# Store images in Container Registry
images:
  - 'gcr.io/${PROJECT_ID}/${_BACKEND_SERVICE}:${_TAG}'
  - 'gcr.io/${PROJECT_ID}/${_BACKEND_SERVICE}:latest'
  - 'gcr.io/${PROJECT_ID}/${_FRONTEND_SERVICE}:${_TAG}'
  - 'gcr.io/${PROJECT_ID}/${_FRONTEND_SERVICE}:latest'

options:
  logging: GCS_ONLY
